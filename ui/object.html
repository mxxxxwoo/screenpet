<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- 물건 하나 = 작은 투명 창 하나 (src-tauri/src/objects.rs). 그림 한 장을 CSS로 돌린다.
         애니메이션 프레임을 돌리지 않는다 — 잠든 물건의 웹뷰는 아무 일도 하지 않는다. -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      /* 자리와 도는 축은 object.js가 정한다 (종류마다 무게중심이 다르다) */
      #thing {
        position: absolute;
        width: 96px;
        height: 96px;
        cursor: grab;
      }

      #art {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      /* 물건에 붙은 노란 포스트잇: 자리는 object.js POSTIT_AT */
      #sticker {
        position: absolute;
        width: 21px;
        height: 21px;
        pointer-events: none;
        animation: stick 220ms ease-out both;
      }

      @keyframes stick {
        from {
          transform: scale(1.5) rotate(-12deg);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      /* 읽는 쪽지: 글자는 textContent로만 들어간다 */
      #note {
        position: absolute;
        left: 8px;
        right: 8px;
        min-height: 40px;
        padding: 8px 10px;
        box-sizing: border-box;
        background: #ffe86e;
        border-bottom-right-radius: 14px 8px;
        box-shadow: 1px 2px 5px rgba(90, 70, 20, 0.35);
        color: #4b3d17;
        font: 13px/1.35 "Segoe UI", "Malgun Gothic", sans-serif;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-align: center;
        animation: note 10s linear both;
      }

      /* 10초 동안 보이고 끝에서 스르륵 (실제로 지우는 건 앱이다) */
      @keyframes note {
        0% {
          opacity: 0;
          transform: translateY(6px) rotate(-1.5deg);
        }
        3%,
        92% {
          opacity: 1;
          transform: rotate(-1.5deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-4px) rotate(-1.5deg);
        }
      }

      /* 보낸 이 꼬리표 "🎯 철수": 친구 화면에서 온 물건 위에 잠깐 (자리는 object.js, 글자는 textContent로만) */
      #tag {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 8px);
        padding: 1px 7px;
        box-sizing: border-box;
        background: rgba(255, 250, 242, 0.9);
        color: #84605c;
        border: 1px solid #84605c;
        border-radius: 9px;
        font: 600 11px/1.2 "Segoe UI", "Malgun Gothic", sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
        animation: tag 200ms ease-out both;
      }
      @keyframes tag {
        from {
          opacity: 0;
          transform: translate(-50%, 4px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%);
        }
      }
      body.poof #thing {
        animation: poof 300ms ease-in forwards;
      }

      /* 💩 다 된 똥은 스르륵 (objects.rs FADE) */
      body.fade #thing {
        transition: opacity 1.5s ease-out;
        opacity: 0;
      }
      body.pixel.fade #thing {
        transition: opacity 1.5s steps(4);
      }

      @keyframes poof {
        60% {
          opacity: 0.8;
          scale: 1.15;
        }
        100% {
          opacity: 0;
          scale: 0.2;
        }
      }

      /* 픽셀 스타일: 90도 계단으로만 돈다 (object.js), 칸을 그대로 */
      body.pixel #art,
      body.pixel #sticker {
        image-rendering: pixelated;
      }
      body.pixel #sticker {
        animation: none;
      }
      body.pixel #tag {
        border: 0;
        border-radius: 0;
        background: #fffaf2;
        box-shadow: 0 -1px 0 #84605c, 0 1px 0 #84605c, -1px 0 0 #84605c, 1px 0 0 #84605c;
        animation: none;
      }
      body.pixel #note {
        border-radius: 0;
        box-shadow: 2px 2px 0 rgba(90, 70, 20, 0.45);
        animation: px-note 10s step-end both;
      }
      @keyframes px-note {
        0% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
      body.pixel.poof #thing {
        animation: px-poof 300ms step-end forwards;
      }
      @keyframes px-poof {
        0% { opacity: 1; }
        33% { opacity: 0; }
        66% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="note" hidden></div>
    <div id="tag" hidden></div>
    <div id="thing">
      <img id="art" alt="" draggable="false" />
      <img id="sticker" alt="" draggable="false" src="objects/postit.png" hidden />
    </div>
    <script src="object.js"></script>
  </body>
</html>
